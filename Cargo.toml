[workspace]
resolver = "2"
members = ["programs/*", "saros-sdk", "saros-dlmm"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anchor-lang = "1.0.0"
anchor-syn = "1.0.0"
solana-account = "3.0.0"
solana-clock = "3.0.1"
solana-compute-budget-interface = "3.0.0"
solana-instruction = "3.0.0"
solana-keypair = "3.0.0"
solana-program = "3.0.0"
solana-program-error = "3.0.0"
solana-program-option = "3.0.0"
solana-program-pack = "3.0.0"
solana-pubkey = "3.0.0"
solana-signature = "=3.3.0"
solana-signer = "3.0.0"
solana-system-interface = "2.0.0"
solana-sysvar = "3.0.0"
solana-transaction = "3.0.0"
solana-client = "3.1.12"
solana-account-decoder = "3.1.12"
solana-program-test = "3.1.12"
tokio = { version = "1", features = ["full"] }
bytemuck = { version = "1.16.1", features = ["derive"] }
jupiter-amm-interface = { version = ">=1.0.0-beta.0, <2" }
arrayref = "0.3.9"
anyhow = "1.0"
thiserror = "2.0.12"
ruint = "1.9.0"
rust_decimal = { version = "1.36.0", features = ["maths", "c-repr"] }
itertools = "0.14.0"


# use for test
async-trait = "0.1.77"
assert_matches = "1.5.0"
glob = "0.3.1"
lazy_static = "1.2.0"
serde_json = "1.0.82"
ahash = "0.8.11"
bincode = "1.3.3"


# SPL
spl-token-interface = "2.0.0"
spl-token-2022-interface = "2.1.0"
spl-associated-token-account-interface = "2.0.0"
spl-memo-interface = "2.0.0"

proptest = "1.4.0"

# Package path
liquidity-book.path = "programs/liquidity-book"
rewarder-hook.path = "programs/rewarder-hook"
saros-sdk.path = "saros-sdk"
saros-dlmm.path = "saros-dlmm"
